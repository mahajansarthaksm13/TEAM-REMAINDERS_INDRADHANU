name: deploy-dev

on:
  push:
    branches: [main]
    paths:
      - 'database/**'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Link the dev project
        working-directory: database
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Push new migrations
        working-directory: database
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy Edge Functions
        working-directory: database
        run: supabase functions deploy ingest heartbeat --project-ref "$PROJECT_REF"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r simulator/requirements.txt
      - name: Y7 ingest suite against dev
        env:
          INGEST_URL: ${{ secrets.INGEST_URL_DEV }}
          TEST_BIN_PRIVATE_KEY: ${{ secrets.TEST_BIN_PRIVATE_KEY }}
          TEST_QR_SERIAL: ${{ secrets.TEST_QR_SERIAL }}
        run: pytest simulator/tests/test_ingest_live.py -v
