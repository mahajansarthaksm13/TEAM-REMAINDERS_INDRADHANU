name: Deploy to Dev & Run Ingest Tests

on:
  push:
    branches:
      - main
    paths:
      - 'database/**'
      - 'supabase/**'
      - 'simulator/**'
  workflow_dispatch:

jobs:
  deploy-dev:
    name: Deploy to Supabase Dev & Execute Y7 Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cryptography pytest

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase instance
        run: npx supabase start

      - name: Deploy Supabase Edge Functions to Dev
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Supabase Edge Functions deployment step initialized."
          # npx supabase functions deploy ingest --project-ref ${{ secrets.SUPABASE_DEV_PROJECT_ID }}

      - name: Execute Y7 Ingest Test Suite
        env:
          PYTHONPATH: "."
        run: |
          python -m pytest simulator/tests/test_ingest.py
