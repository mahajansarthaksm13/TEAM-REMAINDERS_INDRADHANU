name: deploy-prod

# Y19 · Deploy the database and Edge Functions to PRODUCTION, then smoke-test it.
# Manual only (Actions -> deploy-prod -> Run workflow). The `production` environment should
# require a reviewer, so nothing reaches prod without a second person approving the run.
#
# Same steps as deploy-dev, with the prod project, then ops/smoke_test.py, which sends one
# signed scan from the prod DEMO bin only (excluded from every total) and checks that a
# checkpoint exists and that the public verify endpoint answers.
#
# Secrets (set on the `production` environment):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROD_PROJECT_REF, SUPABASE_PROD_DB_PASSWORD
#   SUPABASE_PROD_URL, SUPABASE_PROD_PUBLISHABLE_KEY, SUPABASE_PROD_SERVICE_ROLE_KEY
#   DEMO_BIN_PRIVATE_KEY   (the prod demo bin's key, the same value Vercel uses)
# Optional repository variable: PROD_WEB_URL (also smoke-tests / and /simulator).

on:
  workflow_dispatch:
    inputs:
      first_deploy:
        description: "First deploy only: push the seed (demo bin, catalogue) and skip the checkpoint check. Never tick this again."
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
    steps:
      # A deliberate prod run must fail loudly, not skip, if anything is missing.
      - name: Check secrets
        env:
          SUPABASE_PROD_URL: ${{ secrets.SUPABASE_PROD_URL }}
          SUPABASE_PROD_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PROD_PUBLISHABLE_KEY }}
          SUPABASE_PROD_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PROD_SERVICE_ROLE_KEY }}
          DEMO_BIN_PRIVATE_KEY: ${{ secrets.DEMO_BIN_PRIVATE_KEY }}
        run: |
          missing=""
          for n in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF SUPABASE_PROD_URL \
                   SUPABASE_PROD_PUBLISHABLE_KEY SUPABASE_PROD_SERVICE_ROLE_KEY DEMO_BIN_PRIVATE_KEY; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing production secrets:$missing (see docs/DEPLOY-CHECKLIST.md)"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Link the prod project
        working-directory: database
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push new migrations
        working-directory: database
        run: |
          if [ "${{ inputs.first_deploy }}" = "true" ]; then
            supabase db push --include-seed --password "$SUPABASE_DB_PASSWORD"
          else
            supabase db push --password "$SUPABASE_DB_PASSWORD"
          fi

      - name: Deploy Edge Functions
        working-directory: database
        run: supabase functions deploy ingest heartbeat --project-ref "$PROJECT_REF"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: simulator/requirements.txt
      - run: pip install -r simulator/requirements.txt

      - name: Smoke test (demo bin only)
        env:
          PYTHONPATH: simulator:ops
          SUPABASE_URL: ${{ secrets.SUPABASE_PROD_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PROD_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PROD_SERVICE_ROLE_KEY }}
          DEMO_BIN_PRIVATE_KEY: ${{ secrets.DEMO_BIN_PRIVATE_KEY }}
          WEB_URL: ${{ vars.PROD_WEB_URL }}
        run: |
          if [ "${{ inputs.first_deploy }}" = "true" ]; then
            python ops/smoke_test.py --first-deploy
          else
            python ops/smoke_test.py
          fi
