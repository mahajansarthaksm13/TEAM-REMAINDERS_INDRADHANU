name: ci-ai

# Python is fast, so this runs on every pull request (no path filter).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-ai-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Ruff, pytest, mock data check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ai/requirements.txt
            simulator/requirements.txt
      - run: pip install -r ai/requirements.txt -r simulator/requirements.txt
      - run: ruff check .
      - run: pytest
      - run: python data/validate_mock.py
