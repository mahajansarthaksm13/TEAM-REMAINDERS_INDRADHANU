name: ci-database

# Runs on EVERY pull request so it can be a required check. When nothing in
# database/ changed, the test job is skipped, and GitHub counts a skipped job
# as passed.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-database-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.filter.outputs.database }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            database:
              - 'database/**'
              - '.github/workflows/ci-database.yml'

  database-tests:
    name: Migrations from scratch + database tests
    needs: changes
    if: needs.changes.outputs.database == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: database
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Start Postgres, apply every migration and seed.sql
        run: supabase db start
      - name: Run pgTAP tests
        run: supabase test db
