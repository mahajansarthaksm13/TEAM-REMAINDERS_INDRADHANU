name: Nightly AI Processing Job

on:
  schedule:
    # 01:30 IST is 20:00 UTC previous day
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  ai-nightly-job:
    name: Run AI Integrity, Scoring, and Narration Engine
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas cryptography requests google-generativeai pytest

      - name: Execute AI Core Verification & Scoring
        env:
          PYTHONPATH: "."
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_DATABASE_URL: ${{ secrets.AI_DATABASE_URL }}
        run: |
          python -m pytest ai/tests/
