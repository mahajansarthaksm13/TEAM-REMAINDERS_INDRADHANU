name: nightly-ai

on:
  schedule:
    - cron: '0 20 * * *'      # 01:30 IST
  workflow_dispatch:

concurrency:
  group: nightly-ai
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Skips (instead of failing) until the secrets exist, so a repo without the
  # dev project set up does not send a failure email on every run.
  # Gemini secrets are optional: without them narration uses templates.
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.s.outputs.ready }}
    steps:
      - id: s
        env:
          AI_DATABASE_URL: ${{ secrets.AI_DATABASE_URL }}
        run: |
          if [ -n "$AI_DATABASE_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Secrets not set (AI_DATABASE_URL); skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ai/requirements.txt
      - name: Integrity -> scores -> flags -> trends -> forecast -> narration
        env:
          PYTHONPATH: ai
          AI_DATABASE_URL: ${{ secrets.AI_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: python -m veribin_ai.run
